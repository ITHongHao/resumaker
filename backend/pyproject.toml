[project]
name = "resumaker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlmodel>=0.0.22", "alembic>=1.13", "anthropic>=1.0", "openai>=2.0", "beautifulsoup4>=4.12", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
